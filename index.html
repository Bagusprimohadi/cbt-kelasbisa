<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Ujian CBT Online</title>
  <link rel="stylesheet" href="style.css">

  <!-- Library MathJax v3 untuk Render Rumus Matematika / LaTeX -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <!-- ========================================== -->
  <!-- TAMPILAN 1: FORM REGISTRASI & VERIFIKASI   -->
  <!-- ========================================== -->
  <div id="login-card" class="card">
    <div class="card-header">
      <h2>Ujian Computer Based Test</h2>
      <p>Silahkan isi identitas dan token dengan benar</p>
    </div>

    <form id="form-identitas">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
      </div>

      <div class="form-group">
        <label for="sekolah">Asal Sekolah</label>
        <input type="text" id="sekolah" required placeholder="Masukkan Asal Sekolah">
      </div>

      <div class="form-group">
        <label for="kelas">Kelas / Tingkat</label>
        <input type="text" id="kelas" required placeholder="Contoh: XII MIPA 1">
      </div>

      <div class="form-group">
        <label for="daerah">Daerah / Wilayah</label>
        <input type="text" id="daerah" required placeholder="Contoh: Makassar">
      </div>

      <div class="form-group">
        <label for="token-input">Token Ujian</label>
        <input type="text" id="token-input" required placeholder="Masukkan Kode Token">
      </div>

      <button type="submit" id="btn-login" class="btn-primary">Mulai Ujian</button>
    </form>

    <div id="pesan-error" class="error-msg"></div>
  </div>

  <!-- ========================================== -->
  <!-- TAMPILAN 2: ARENA SOAL CBT                 -->
  <!-- ========================================== -->
  <div id="cbt-container" class="cbt-layout hidden">
    
    <!-- Topbar Identitas Peserta -->
    <header class="cbt-header">
      <div class="user-info">
        <h3 id="disp-nama">Nama Peserta</h3>
        <span id="disp-meta">Sekolah | Kelas</span>
      </div>
    </header>

    <!-- Content Utama CBT -->
    <main class="cbt-main">
      
      <!-- Box Soal & Opsi -->
      <section class="question-box">
        <div class="q-header">
          <span>Soal Nomor <strong id="q-num">1</strong></span>
        </div>

        <!-- Wadah Gambar Soal (di-render via JS jika ada link) -->
        <div id="q-image-container" class="image-wrapper"></div>

        <!-- Teks Soal -->
        <div id="q-text" class="q-content">Memuat soal...</div>
        
        <!-- Pilihan Opsi A, B, C, D, E -->
        <div id="options-box" class="options-container"></div>

        <!-- Tombol Navigasi Bawah -->
        <div class="nav-buttons">
          <button id="btn-prev" class="btn-nav" onclick="navigasi(-1)">← Sebelumnya</button>
          <button id="btn-next" class="btn-nav" onclick="navigasi(1)">Berikutnya →</button>
          <button id="btn-submit" class="btn-finish hidden" onclick="konfirmasiSubmit()">Selesai & Submit</button>
        </div>
      </section>

      <!-- Panel Samping: Nomor Soal Grid -->
      <aside class="number-grid-box">
        <h4>Navigasi Soal</h4>
        <div id="number-grid" class="grid-container"></div>
      </aside>

    </main>
  </div>

  <!-- Script Logika CBT -->
  <script src="script.js"></script>
</body>
</html>
