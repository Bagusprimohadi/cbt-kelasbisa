<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Online - Exam System</title>
  <link rel="stylesheet" href="style.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$'], ['(', ')']], // Mengenali ( ... ), \( ... \), dan $ ... $
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- PAGE 1: FORM LOGIN & TOKEN -->
  <div id="login-card" class="card">
    <div class="card-header">
      <h2>LOGIN PESERTA CBT</h2>
      <p>Masukkan Identitas dan Token Ujian</p>
    </div>
    <form id="form-identitas">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
      </div>
      <div class="form-group">
        <label>Asal Sekolah / Kelas</label>
        <input type="text" id="sekolah" required placeholder="Contoh: XII MIPA 1">
      </div>
      <div class="form-group">
        <label>Nomor Peserta / NISN</label>
        <input type="text" id="nisn" required placeholder="Contoh: 17-211-151">
      </div>
      <div class="form-group">
        <label>Token Ujian</label>
        <input type="text" id="token-input" required placeholder="Masukkan Kode Token">
      </div>
      <button type="submit" class="btn-primary">Mulai Ujian</button>
    </form>
    <div id="pesan-error" class="error-msg"></div>
  </div>

  <!-- PAGE 2: ARENA SOAL CBT -->
  <div id="cbt-container" class="cbt-layout hidden">
    
    <!-- HEADER ATAS (WARNA UNGU SERA) -->
    <header class="top-bar">
      <div class="header-left">
        <img id="logo-lembaga" src="" alt="Logo" class="logo-img">
        <div class="title-box">
          <h2 id="disp-lembaga">NAMA LEMBAGA</h2>
          <small id="disp-sub-lembaga">SUB KETERANGAN</small>
        </div>
      </div>
      <div class="header-right">
        <div class="user-avatar">👤</div>
        <div class="user-details">
          <span id="disp-nama" class="u-name">NANDA</span>
          <span id="disp-nisn" class="u-id">17-211-151</span>
          <a href="#" onclick="location.reload()" class="btn-keluar">KELUAR &gt;&gt;</a>
        </div>
      </div>
    </header>

    <!-- WORKSPACE CBT -->
    <div class="cbt-body">
      
      <!-- AREA UTAMA (SOAL & OPSI) -->
      <main class="question-area">
        <div class="sub-header">
          <h3 class="q-title">SOAL NO : <span id="q-num">1</span></h3>
          <div class="timer-display">
            ⏰ <span id="timer">00:00:00</span>
          </div>
        </div>

        <div class="question-content">
          <div id="q-image-container" class="img-box"></div>
          <p id="q-text" class="q-text">Memuat soal...</p>
          
          <div id="options-box" class="options-group"></div>
        </div>
      </main>

      <!-- PANEL NAVIGASI BULATAN (KANAN) -->
      <aside class="sidebar-nav">
        <div id="number-grid" class="circle-grid"></div>
      </aside>

    </div>

    <!-- FOOTER NAVBAR (TOMBOL NAVIGASI BAWAH) -->
    <footer class="bottom-bar">
      <div class="bottom-left">
        <button id="btn-submit" class="btn-footer btn-selesai" onclick="konfirmasiSubmit()">🏁 SELESAI</button>
      </div>
      <div class="bottom-center">
        <button id="btn-prev" class="btn-footer" onclick="navigasi(-1)">◀ Soal Sebelumnya</button>
        <button id="btn-next" class="btn-footer" onclick="navigasi(1)">Soal Selanjutnya ▶</button>
      </div>
      <div class="bottom-right">
        <button class="btn-footer" onclick="toggleNavigator()">🔭 Navigator</button>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
