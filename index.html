<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Online - Exam System</title>
  <link rel="stylesheet" href="style.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$'], ['(', ')']], // Mengenali ( ... ), \( ... \), dan $ ... $
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <!-- PAGE 1: FORM LOGIN, INFO KEGIATAN & TOKEN -->
  <div id="login-card" class="card">
    <!-- Header Branding (Rata Tengah) -->
    <div class="header-welcome">
      <img id="logo-lembaga" src="" alt="Logo" class="logo-img">
      <h2>Selamat Datang di CBT/CAT Kelas Bisa</h2>
      <h3 id="disp-lembaga">-</h3>
    </div>

    <!-- Tabel Informasi Kegiatan Ciamik -->
    <div class="info-kegiatan-box">
      <h4>Informasi Kegiatan</h4>
      <table class="table-info">
        <tr>
          <td>Sub Lembaga</td>
          <td id="disp-sub-lembaga">-</td>
        </tr>
        <tr>
          <td>Durasi Ujian</td>
          <td><span id="disp-durasi">-</span> Menit</td>
        </tr>
      </table>
    </div>

    <!-- Form Identitas -->
    <form id="form-identitas">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
      </div>
      <div class="form-group">
        <label>Asal Instansi/Sekolah/Kampus</label>
        <input type="text" id="sekolah" required placeholder="Contoh: Universitas Hasanuddin / SMA 1">
      </div>
      <div class="form-group">
        <label>Bidang Kerja/Kelas/Jurusan Kuliah</label>
        <input type="text" id="kelas" required placeholder="Contoh: Meteorologi / XII MIPA 1">
      </div>
      <div class="form-group">
        <label>NIK/NISN/NIM</label>
        <input type="text" id="nisn" required placeholder="Masukkan NIK, NISN, atau NIM">
      </div>
      <div class="form-group">
        <label>Asal Daerah (Kab-Prov)</label>
        <input type="text" id="daerah" required placeholder="Contoh: Makassar - Sulawesi Selatan">
      </div>
      <div class="form-group">
        <label>Token Ujian</label>
        <input type="text" id="token-input" required placeholder="Masukkan Kode Token">
      </div>
      
      <button type="submit" id="btn-mulai" class="btn-primary">Mulai Ujian</button>
    </form>

    <p id="pesan-error" class="error-msg"></p>

    <!-- Footer Pesan Motivasi -->
    <div class="footer-motto">
      <p>Selamat Mengerjakan Ujiannya, Utamakan Integritas</p>
    </div>
  </div>

  <!-- PAGE 2: ARENA SOAL CBT -->
  <div id="cbt-container" class="cbt-layout hidden">
    
    <!-- HEADER ATAS -->
    <header class="top-bar">
      <div class="header-left">
        <img id="logo-lembaga-cbt" src="" alt="Logo" class="logo-img">
        <div class="title-box">
          <h2 id="disp-lembaga-cbt">NAMA LEMBAGA</h2>
          <small id="disp-sub-lembaga-cbt">SUB KETERANGAN</small>
        </div>
      </div>
      <div class="header-right">
        <div class="user-avatar">👤</div>
        <div class="user-details">
          <span id="disp-nama" class="u-name">-</span>
          <span id="disp-nisn" class="u-id">-</span>
          <a href="#" onclick="location.reload()" class="btn-keluar">KELUAR &gt;&gt;</a>
        </div>
      </div>
    </header>

    <!-- WORKSPACE CBT -->
    <div class="cbt-body">
      
      <!-- AREA UTAMA (SOAL & OPSI) -->
      <main class="question-area">
        <div class="sub-header">
          <h3 class="q-title">SOAL NO : <span id="q-num">1</span></h3>
          <div class="timer-display">
            ⏰ <span id="timer">00:00:00</span>
          </div>
        </div>

        <div class="question-content">
          <div id="q-image-container" class="img-box"></div>
          <div id="q-text" class="q-text">Memuat soal...</div>
          
          <div id="options-box" class="options-group"></div>
        </div>
      </main>

      <!-- PANEL NAVIGASI BULATAN (KANAN) -->
      <aside class="sidebar-nav">
        <div id="number-grid" class="circle-grid"></div>
      </aside>

    </div>

    <!-- FOOTER NAVBAR (TOMBOL NAVIGASI BAWAH) -->
    <footer class="bottom-bar">
      <div class="bottom-left">
        <button id="btn-submit" class="btn-footer btn-selesai" onclick="konfirmasiSubmit()">🏁 SELESAI</button>
      </div>
      <div class="bottom-center">
        <button id="btn-prev" class="btn-footer" onclick="navigasi(-1)">◀ Soal Sebelumnya</button>
        <button id="btn-next" class="btn-footer" onclick="navigasi(1)">Soal Selanjutnya ▶</button>
      </div>
      <div class="bottom-right">
        <button class="btn-footer" onclick="toggleNavigator()">🔭 Navigator</button>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
